<body>
<main class="widget" id="widget">
<header class="top"><img class="logo" src="school-logo.png" alt="School logo" onerror="this.style.display='none';document.getElementById('fallback').style.display='flex'"><span class="logo-fallback" id="fallback">🎓</span><div class="heading"><strong>B/Hindu College AI Assistant</strong><div class="status"><span class="dot"></span>School Knowledge + AI Brain</div></div><button class="close" id="close" aria-label="Close chat">×</button></header>
<section class="chat" id="chat" aria-live="polite"><div class="welcome" id="welcome"><div class="welcome-icon" aria-hidden="true">✨</div><h1>Welcome to your school AI</h1><p>Ask about your teachers, school timetable and more.</p><div class="welcome-grid"><button type="button" class="welcome-card" data-question="Who is the Grade 11 class teacher?"><span class="emoji">👩‍🏫</span><span><strong>Class teachers</strong><small>Find your class teacher</small></span></button><button type="button" class="welcome-card" data-question="Show full timetable"><span class="emoji">📅</span><span><strong>Daily timetable</strong><small>Explore all school periods</small></span></button><button type="button" class="welcome-card" data-question="Who is the principal?"><span class="emoji">🏫</span><span><strong>School information</strong><small>Leadership and sections</small></span></button><button type="button" class="welcome-card" data-question="Explain photosynthesis simply"><span class="emoji">📚</span><span><strong>Study with AI</strong><small>Ask an educational question</small></span></button></div></div></section>
<nav class="suggestions" aria-label="Suggested questions"><button type="button" data-question="Show full timetable">📅 Full timetable</button><button type="button" data-question="5th period time">🕒 5th period</button><button type="button" data-question="Who is the principal?">🎓 Principal</button></nav><footer class="bottom"><form class="form" id="form"><textarea class="input" id="input" aria-label="Your message" placeholder="Type your message..." rows="1" maxlength="4000" required></textarea><button class="send" id="send" aria-label="Send message" type="submit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form><div class="foot">B/Hindu College AI Assistant · Chats are not saved</div></footer>
</main><button class="reopen" id="reopen">💬 Open school AI chat</button>
<script>
// AI requests use the local /api/chat proxy. Keep GROQ_API_KEY on the server, not in this HTML file.
const GROQ_URL='/api/chat';
const GROQ_MODEL='openai/gpt-oss-20b';
const AI_SYSTEM='You are B/Hindu College AI Assistant. Answer school-specific questions only from the verified school knowledge supplied below. If it is missing, say it is not verified. For general educational questions, explain clearly and helpfully. Never invent school announcements, teachers, marks or student records. When a timetable answer is supplied by the local timetable logic, do not override it with guesses.';
// IMPORTANT: do not put a shared Groq API key in a public HTML file. Use a backend/proxy for AI requests.
const groqKey='';
const form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat');
const history=[];let busy=false;let knowledge=[];let knowledgeReady;
// The public school knowledge file is searched BEFORE contacting Groq.
knowledgeReady=fetch('./knowledge.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Knowledge unavailable: HTTP '+r.status);return r.json()}).then(data=>{knowledge=Array.isArray(data.entries)?data.entries.filter(e=>e&&typeof e.title==='string'&&typeof e.content==='string'):[];if(!knowledge.length)throw Error('Knowledge file has no entries');return true;}).catch(err=>{console.warn('School knowledge not loaded:',err);return false;});
// Normalize common school-question spelling errors without changing unrelated questions.
const ORDINALS={first:1,frist:1,one:1,second:2,secound:2,two:2,third:3,thrid:3,three:3,fourth:4,forth:4,four:4,fifth:5,fivth:5,five:5,sixth:6,six:6,seventh:7,seven:7,eighth:8,eight:8};
function normalize(s){return s.toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim();}
function distance(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){let old=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old;}}return d[b.length];}
function similar(a,b){return a===b||(a.length>=4&&b.length>=4&&distance(a,b)<= (Math.min(a.length,b.length)>=7?2:1));}
function words(s){return normalize(s).split(' ').filter(Boolean);}
const STOP=new Set(['what','when','where','which','who','how','tell','about','please','give','show','me','the','a','an','is','are','of','for','in','on','at','to','do','does','can','you','my','our','school','hindu','college','details','information','time','timing','name','who','is','what','whats']);
function entry(id){return knowledge.find(e=>e.id===id);}

// ---------- Live timetable helper ----------
// School timetable calculations are deliberately done in the browser using the
// school's timezone, rather than the visitor's computer timezone. Intl.DateTimeFormat
// supports an explicit IANA timezone such as Asia/Colombo. See MDN:
// https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat
const SCHOOL_TIME_ZONE='Asia/Colombo';
const WEEK_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SUBJECT_NAMES={
  TA:'Technology & Applied Arts', ENG:'English', MA:'Mathematics', SCI:'Science',
  SIN:'Sinhala', GEO:'Geography', COM:'Commerce', HIS:'History', REL:'Religion',
  ICT:'ICT', LIB:'Library', HE:'Health Education', CIV:'Civics', PTS:'PTS'
};
function schoolNow(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:SCHOOL_TIME_ZONE,weekday:'long',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const get=k=>parts.find(p=>p.type===k)?.value||'';
  let hour=Number(get('hour')); if(hour===24)hour=0;
  return {weekday:get('weekday'),year:Number(get('year')),month:Number(get('month')),day:Number(get('day')),hour,minute:Number(get('minute')),minutes:hour*60+Number(get('minute'))};
}
function minutesFromTime(text){
  const m=String(text).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return NaN;
  let h=Number(m[1])%12;if(m[3].toUpperCase()==='PM')h+=12;return h*60+Number(m[2]);
}
function parseTimetableEntry(found){
  if(!found?.id?.startsWith('timetable-grade-'))return null;
  const days={};
  found.content.split(/\n+/).forEach(line=>{
    const m=line.match(/^(Monday|Tuesday|Wednesday|Thursday|Friday):\s*(.+)$/i);if(!m)return;
    const periods={};
    m[2].split(/,\s*/).forEach(part=>{const p=part.match(/^(\d+)\s+(.+)$/);if(p)periods[Number(p[1])]=p[2].trim();});
    days[m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()]=periods;
  });
  return days;
}
function classLabelFromEntry(found){return found?.title?.match(/Grade\s+(\d+[A-Z]?)/i)?.[1]||'';}
function findLiveSchoolPeriod(question){
  if(!/(\bwhat\s+(?:period|class|subject)\b.*\bnow\b|\bcurrent\s+(?:period|subject)\b|\b(?:period|subject)\s+now\b|\bwhat.?s\s+now\b)/i.test(question))return null;
  const n=schoolNow();
  return {id:'live-school-period',category:'Timetable',title:'Current School Period',content:'',schoolNow:n};
}
function liveSchoolPeriodHTML(){
  const now=schoolNow(),info=currentPeriodInfo(now);
  const timeText=new Intl.DateTimeFormat('en-US',{timeZone:SCHOOL_TIME_ZONE,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}).format(new Date());
  const dateText=new Intl.DateTimeFormat('en-GB',{timeZone:SCHOOL_TIME_ZONE,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
  let title,sub,badge;
  if(info.state==='period'){badge='● NOW';title=info.slot.label;sub=info.slot.start+' – '+info.slot.end;}
  else if(info.state==='interval'){badge='☕ BREAK';title='Interval';sub='10:30 AM – 10:50 AM';}
  else if(info.state==='before'){badge='⌚ BEFORE SCHOOL';title='School has not started';sub='1st Period starts at 7:50 AM';}
  else {badge='✓ SCHOOL ENDED';title='No current period';sub='8th Period ended at 1:30 PM';}

function findClassTimetable(question){
  const w=words(question),q=w.join(' ');
  const match=q.match(/\b(?:grade|class|std|standard|grde)\s*0*(1[0-3]|[1-9])\s*([abe])?\b/)
    ||q.match(/\b0*(1[0-3]|[1-9])\s*([abe])\b/);

  const grade=String(Number(match[1])),section=(match[2]||'').toLowerCase();
  const candidates=knowledge.filter(e=>e.id?.startsWith('timetable-grade-'));
  const found=candidates.find(e=>{
    const label=classLabelFromEntry(e),m=label.match(/^(\d+)([A-Z]?)$/i);if(!m||String(Number(m[1]))!==grade)return false;

}

  if(trim.startsWith('```')){flush();const lang=trim.slice(3).trim().toLowerCase();let code=[];while(++i<lines.length&&!lines[i].trim().startsWith('```'))code.push(lines[i]);if(lang==='chart'){out+=chartFromJSON(code.join('\n'));}else{out+='<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>';}continue;}

  if(!trim){flush();continue;}
  const heading=trim.match(/^(#{1,3})\s+(.+)$/);if(heading){flush();out+='<h'+Math.min(heading[1].length+1,3)+'>'+inlineMarkdown(heading[2])+'</h'+Math.min(heading[1].length+1,3)+'>';continue;}

  if(list){out+='</'+list+'>';list=null;}paragraph.push(trim);

}

function leadershipProfileHTML(found){const name=found.content.match(/\bis\s+(.+?)\.?$/)?.[1]?.replace(/\.$/,'')||found.content;return '<section class="visual-panel"><div class="visual-head"><span class="visual-icon">🏫</span><div><h3>'+escapeHTML(found.title)+'</h3><small>B/Hindu College leadership</small></div></div><div class="profile-panel"><div class="profile-avatar">🎓</div><div><div class="profile-label">'+escapeHTML(found.title)+'</div><div class="profile-name">'+escapeHTML(name)+'</div></div></div></section>';}
function visualAnswer(found){return found&&(found.category==='Teachers'||found.id==='timetable-full'||found.id==='interval'||/^period-[1-8]$/.test(found.id)||/principal|sectional-head/.test(found.id));}
function decorateAnswer(el,found){if(visualAnswer(found))el.classList.add('visual-answer');if(el.classList.contains('typing'))return;if(el.querySelector('.answer-actions'))return;const answer=el.textContent.trim();if(!answer)return;const actions=document.createElement('div');actions.className='answer-actions';const btn=document.createElement('button');btn.type='button';btn.className='answer-copy';btn.textContent='⧉ Copy answer';btn.onclick=async()=>{try{await navigator.clipboard.writeText(found?.content||answer);btn.textContent='✓ Copied';setTimeout(()=>btn.textContent='⧉ Copy answer',1500)}catch{btn.textContent='Copy unavailable'}};actions.append(btn);el.append(actions);}
// Event delegation keeps teacher search working in dynamically added answers.
document.getElementById('chat').addEventListener('input',e=>{if(!e.target.matches('.visual-search'))return;const panel=e.target.closest('.teacher-directory');const term=normalize(e.target.value);let visible=0;panel.querySelectorAll('[data-teacher-search]').forEach(card=>{const match=normalize(card.dataset.teacherSearch).includes(term);card.hidden=!match;if(match)visible++;});panel.querySelector('.visual-count').textContent=visible+' classes';panel.querySelector('.teacher-empty').hidden=visible!==0;});
function answerHTML(answer,found){
 if(found?.id?.startsWith('subject-specific-'))return subjectSpecificHTML(found);
 if(/subject\s+teach/i.test(found?.title?.replace(/techers/i,'teachers')||'') && /Grade\s+0*\d/i.test(found.title))return subjectTeachersHTML(found);
 if(found?.id==='class-teachers-all')return teacherDirectoryHTML();
 if(found?.id?.startsWith('class-teacher-sections-'))return teacherSectionsHTML(found);
 if(/^class-teacher-/.test(found?.id||''))return teacherProfileHTML(found);
 if(found&&(/principal|sectional-head/.test(found.id)))return leadershipProfileHTML(found);
 if(found?.liveTimetable)return liveTimetableHTML(found.liveTimetable);
 if(found?.id==='live-school-period')return liveSchoolPeriodHTML();
 if(found?.id==='timetable-full')return scheduleHTML();
 if(found?.id==='interval'||/^period-[1-8]$/.test(found?.id||'')){const r=found.id==='interval'?PERIOD_TIMES[4]:PERIOD_TIMES[Number(found.id.split('-')[1])>4?Number(found.id.split('-')[1]):Number(found.id.split('-')[1])-1];return '<div class="time-card'+(found.id==='interval'?' break-card':'')+'"><div class="time-card-label">'+(found.id==='interval'?'☕':'🕒')+' '+escapeHTML(r[0])+'</div><div class="time-card-value">'+r[1]+' – '+r[2]+'</div></div>';}
 return markdown(answer);
}
function bubble(text,role,found){const el=document.createElement('div');el.className='bubble '+role+(role==='assistant'?' rich':'');if(role==='assistant')el.innerHTML=answerHTML(text,found);else el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
async function submitQuestion(text){text=text.trim();if(!text||busy)return;busy=true;send.disabled=true;input.value='';document.getElementById('welcome')?.remove();bubble(text,'user');history.push({role:'user',content:text});const pending=bubble('Searching school knowledge…','assistant');pending.classList.add('typing');pending.innerHTML='<span class="typing-dots" role="status" aria-label="Thinking"><i></i><i></i><i></i></span>';try{
const loaded=await knowledgeReady;const found=findKnowledge(text);
if(found){const answer=found.content;pending.classList.remove('typing');if(visualAnswer(found))pending.classList.add('visual-answer');pending.innerHTML=answerHTML(answer,found);decorateAnswer(pending,found);history.push({role:'assistant',content:answer});}
else {if(!loaded && /\b(teacher|principal|sectional|grade|class|timetable|period)\b/i.test(text)){pending.classList.remove('typing');pending.textContent='School knowledge could not be loaded. Please check that knowledge.json is published beside index.html and refresh the page.';history.pop();return;}pending.innerHTML='<span class="typing-dots" role="status" aria-label="Thinking"><i></i><i></i><i></i></span>';
const schoolContext=loaded?knowledge.map(e=>({title:e.title,content:e.content})):[];
const messages=[{role:'system',content:AI_SYSTEM+'\nVerified school knowledge (public information only): '+JSON.stringify(schoolContext).slice(0,28000)},...history.slice(-10)];
const res=await fetch(GROQ_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:GROQ_MODEL,messages,max_completion_tokens:1024})});const data=await res.json();if(!res.ok)throw Error(typeof data.error==='string'?data.error:data.error?.message||'Request failed');const answer=data.choices?.[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw Error('Empty AI response');pending.classList.remove('typing');pending.innerHTML=answerHTML(answer);decorateAnswer(pending,null);history.push({role:'assistant',content:answer});}
}catch(err){pending.classList.remove('typing');const fallback=findKnowledge(text);if(visualAnswer(fallback))pending.classList.add('visual-answer');pending.innerHTML=fallback?answerHTML(fallback.content,fallback):markdown('AI Brain unavailable: '+(err instanceof TypeError?'Direct browser request blocked or network unavailable. Groq may require a backend.':String(err.message||err))); if(fallback)decorateAnswer(pending,fallback);if(fallback)history.push({role:'assistant',content:fallback.content});else history.pop();console.error('Chat request failed:',err);}finally{busy=false;send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;}}
form.addEventListener('submit',e=>{e.preventDefault();submitQuestion(input.value);});
document.querySelectorAll('[data-question]').forEach(btn=>btn.addEventListener('click',()=>submitQuestion(btn.dataset.question)));
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
document.getElementById('close').addEventListener('click',()=>{document.getElementById('widget').classList.add('closed');document.getElementById('reopen').classList.add('visible');});document.getElementById('reopen').addEventListener('click',()=>{document.getElementById('widget').classList.remove('closed');document.getElementById('reopen').classList.remove('visible');});
</script></body></html>
