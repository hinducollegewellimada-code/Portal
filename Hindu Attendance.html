.main{min-width:0}

.sheet .school{text-align:center;font:700 20px/1.2 var(--serif)}

.sheet .panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:24px;margin-top:18px;border:1px solid rgba(221,229,240,.6)}
.class-badge{text-align:center;margin:2px 0 4px}
.class-badge b{display:block;font:700 44px/1.05 var(--serif)}
.class-badge span{color:var(--muted);font-weight:600}
.datebar{text-align:center;background:var(--sky);color:var(--navy-2);font-weight:600;padding:9px 12px;border-radius:12px;margin:14px 0 18px}
.count-input{font:700 34px var(--serif);text-align:center;min-height:68px;border-radius:16px;letter-spacing:.02em}
.total-box{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-radius:16px;background:var(--navy);color:#fff;margin:16px 0}

.btn.huge{min-height:60px;font-size:17px;border-radius:16px;letter-spacing:.02em}
.submitted-card .ok-mark{width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}

.kv div{background:var(--paper);border-radius:14px;padding:12px 6px}
.kv b{display:block;font:700 30px/1.1 var(--serif)}
.kv span{font-size:12.5px;color:var(--muted);font-weight:600}
.link-row{text-align:center;margin-top:14px;font-size:14px}

.qr-tile h3{font:700 20px var(--serif)}
.qr-tile .qr{display:grid;place-items:center;margin:12px auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;width:fit-content}
.qr-tile .qr img,.qr-tile .qr canvas{display:block}
.qr-tile code{background:var(--sky);padding:2px 10px;border-radius:8px;font-weight:700}

.tabs button.on{color:var(--navy);border-color:var(--blue)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:16px}
.class-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

.acard{background:var(--card);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);border:1px solid rgba(221,229,240,.6)}
.acard-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}

 body.printing{background:#fff}
 body.printing>*:not(#printArea){display:none!important}

}

@media (max-width:860px){
 #app{display:block}
 #sidebar{position:fixed;z-index:60;left:0;top:0;width:280px;transform:translateX(-102%);transition:transform .25s;bottom:0}
 #app.nav-open #sidebar{transform:none}
 #app.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(11,36,71,.5);z-index:50}

function todayISO(now=new Date()){ return new Intl.DateTimeFormat("en-CA",{timeZone:TIMEZONE}).format(now); }

function isISODate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||""); }

function fmtDateShort(iso){ if(!isISODate(iso)) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function fmtTime(ts){ if(!ts) return "Just now"; const dt=typeof ts.toDate==="function"?ts.toDate():new Date(ts); if(isNaN(dt)) return "—"; return dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TIMEZONE}); }
const docId = (classId,date) => `${classId}_${date}`;
function parseOne(raw,label){ const s=String(raw??"").trim(); if(s==="") return {error:`Please enter the number of ${label}.`}; if(/^-/.test(s)) return {error:`${label[0].toUpperCase()+label.slice(1)} cannot be negative.`}; if(!/^\d+$/.test(s)) return {error:`Please enter ${label} as a whole number (0, 1, 2 …).`}; const n=parseInt(s,10); if(n>MAX_PER_CLASS) return {error:`That number looks too large. Please check the ${label} count.`}; return {value:n}; }
function validateCounts(boysRaw,girlsRaw){ const b=parseOne(boysRaw,"boys"),g=parseOne(girlsRaw,"girls"); const errors={}; if(b.error) errors.boys=b.error; if(g.error) errors.girls=g.error; const ok=!b.error&&!g.error; return {ok,errors,boys:b.value,girls:g.value,total:ok?b.value+g.value:null}; }
function liveTotal(boysRaw,girlsRaw){ const v=validateCounts(boysRaw,girlsRaw); return v.ok?v.total:null; }
function normKey(s){ return String(s??"").toLowerCase().replace(/grade|class/g,"").replace(/[^a-z0-9]/g,""); }
function buildRows(classes,counts){ const byClass=new Map(counts.map(c=>[c.classId,c])); return classes.filter(c=>c.active!==false).slice().sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999)).map(c=>{ const r=byClass.get(c.classId); return {classId:c.classId,className:c.name||"Grade "+c.classId,submitted:!!r,boys:r?r.boys:null,girls:r?r.girls:null,total:r?r.total:null,submittedAt:r?r.submittedAt:null,submittedBy:r?r.submittedBy:""}; }); }
function totalsFrom(rows){ const sub=rows.filter(r=>r.submitted); const boys=sub.reduce((s,r)=>s+r.boys,0); const girls=sub.reduce((s,r)=>s+r.girls,0); return {boys,girls,total:boys+girls,classCount:rows.length,submitted:sub.length,missing:rows.length-sub.length}; }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const csvCell = v => { const s=String(v??""); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function toCSV(rows2d){ return "\uFEFF"+rows2d.map(r=>r.map(csvCell).join(",")).join("\r\n"); }
function dailyReportCSV(date,rows,t){ const out=[[SCHOOL_NAME],["Daily Student Count Report"],["Date",fmtDateLong(date)],[],["Class","Boys","Girls","Total","Status"]]; rows.forEach(r=>out.push([r.className,r.submitted?r.boys:"",r.submitted?r.girls:"",r.submitted?r.total:"",r.submitted?"Submitted":"Not Submitted"])); out.push([],["Total Boys",t.boys],["Total Girls",t.girls],["Total Students",t.total],["Classes Submitted",t.submitted],["Classes Not Submitted",t.missing]); return toCSV(out); }
function dailyReportHTML(date,rows,t,logoSrc=LOGO){ const body=rows.map(r=>`<tr><td>${escapeHtml(r.className)}</td><td class="num">${r.submitted?r.boys:"–"}</td><td class="num">${r.submitted?r.girls:"–"}</td><td class="num">${r.submitted?r.total:"–"}</td><td>${r.submitted?"Submitted":"Not Submitted"}</td></tr>`).join(""); return `<div class="report-sheet"><div class="report-head"><img src="${logoSrc}" alt="" width="64" height="64"><div><h1>${SCHOOL_NAME}</h1><h2>Daily Student Count Report</h2><p>Date: ${fmtDateLong(date)}</p></div></div><table class="report-table"><thead><tr><th>Class</th><th class="num">Boys</th><th class="num">Girls</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>${body}</tbody></table><table class="report-totals"><tbody><tr><th>Total Boys</th><td>${t.boys}</td></tr><tr><th>Total Girls</th><td>${t.girls}</td></tr><tr><th>Total Students</th><td>${t.total}</td></tr><tr><th>Classes Submitted</th><td>${t.submitted} / ${t.classCount}</td></tr><tr><th>Classes Not Submitted</th><td>${t.missing}</td></tr></tbody></table><p class="report-foot">Generated ${new Date().toLocaleString("en-GB",{timeZone:TIMEZONE})} · WHC Student Daily Count Management System</p></div>`; }
function friendlyError(e,fallback="Something went wrong. Please try again."){ if(typeof navigator!=="undefined"&&navigator.onLine===false) return "You appear to be offline. Check your internet connection and try again."; const code=(e&&(e.code||e.message))||""; if(/permission-denied/.test(code)) return "You don't have permission to do that."; if(/unavailable|network|failed-to-get|deadline/.test(code)) return "Can't reach the school database right now. Check your connection and try again."; if(/already-exists|DUPLICATE/.test(code)) return "Today's count has already been submitted."; if(/not-found/.test(code)) return "That record could not be found."; if(/resource-exhausted/.test(code)) return "The system is busy. Please try again in a few minutes."; return fallback; }

/* ================================ auth ================================= */
const KEY="whc_daily_session", LOCK_KEY="whc_daily_lock", SESSION_HOURS=8, MAX_FAILS=5, LOCK_SECONDS=60;
const ADMIN_ROLES=["principal","deputy_principal","vice_principal","admin"];
const ROLE_LABELS={principal:"Principal",deputy_principal:"Deputy Principal",vice_principal:"Vice Principal",admin:"Admin",sectional_head:"Sectional Head",teacher:"Teacher"};
const cleanRole = r => String(r||"teacher").trim().toLowerCase().replace(/[\s-]+/g,"_");
function getSession(){ try{ const s=JSON.parse(sessionStorage.getItem(KEY)||"null"); if(!s||Date.now()-s.at>SESSION_HOURS*3600e3){ sessionStorage.removeItem(KEY); return null; } return s; }catch{ return null; } }
function logoutUser(){ sessionStorage.removeItem(KEY); }
const isAdminUser = u => !!u && ADMIN_ROLES.includes(u.role);
function canEditClass(u,classId,className=""){ if(!u) return false; if(isAdminUser(u)) return true; if(u.role!=="teacher"&&u.role!=="sectional_head") return false; const mine=normKey(u.className); return !!mine&&(mine===normKey(classId)||mine===normKey(className)); }
function lockRemaining(){ const until=Number(sessionStorage.getItem(LOCK_KEY+"_until")||0); return Math.max(0,Math.ceil((until-Date.now())/1000)); }
const userErr = m => Object.assign(new Error(m),{userMessage:m});
async function login(username,password){
  const wait=lockRemaining(); if(wait>0) throw userErr(`Too many attempts. Please wait ${wait} seconds and try again.`);
  username=String(username||"").trim(); if(!username||!password) throw userErr("Enter your username and password.");
  if(navigator.onLine===false) throw userErr("You appear to be offline. Check your connection and try again.");
  let snap;
  try{ snap=await getDocs(query(collection(db,COL.staff),where("username","==",username),where("password","==",password),limit(1))); }
  catch(e){ console.error("login query failed",e); throw userErr("Can't reach the school database right now. Please try again."); }
  if(snap.empty){ const fails=Number(sessionStorage.getItem(LOCK_KEY)||0)+1; sessionStorage.setItem(LOCK_KEY,String(fails));
    if(fails>=MAX_FAILS){ sessionStorage.setItem(LOCK_KEY,"0"); sessionStorage.setItem(LOCK_KEY+"_until",String(Date.now()+LOCK_SECONDS*1000)); }
    throw userErr("Username or password is incorrect."); }
  sessionStorage.setItem(LOCK_KEY,"0");
  const d=snap.docs[0].data();
  const user={ id:snap.docs[0].id, name:d.name||username, username, role:cleanRole(d.role), className:d.className||"", at:Date.now() };
  sessionStorage.setItem(KEY,JSON.stringify(user));
  return user;
}
function requireAdmin(){
  const u=getSession();
  if(!isAdminUser(u)){ nav("login", { next: location.hash.slice(1) || "#/dashboard" }); return null; }
  return u;
}

function parseHash(){
  const h=(location.hash||"#/").replace(/^#\/?/,"");
  const [pathPart,queryPart]=h.split("?");
  const segs=pathPart.split("/").filter(Boolean);
  const q=Object.fromEntries(new URLSearchParams(queryPart||""));
  return { page: segs[0]||"home", seg1: segs[1]||"", q };
}
function hashFor(page, params={}){
  const qs=new URLSearchParams(params).toString();
  return "#/"+page+(qs?("?"+qs):"");
}
function nav(page, params={}){ location.hash = hashFor(page, params); }

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const debounce=(fn,ms=200)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };
const root=$("#root");

function toast(msg,type="ok"){
  let box=$("#toasts"); if(!box){ box=document.createElement("div"); box.id="toasts"; box.setAttribute("aria-live","polite"); document.body.append(box); }
  const t=document.createElement("div"); t.className="toast "+type; t.innerHTML=`${icon(type==="ok"?"check":"alert")}<span>${escapeHtml(msg)}</span>`;
  box.append(t); setTimeout(()=>t.remove(),4200);
}
function setBusy(btn,busy,labelBusy="Please wait…"){
  if(!btn) return;
  if(busy){ btn.dataset.label=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>${labelBusy}`; }
  else{ btn.disabled=false; if(btn.dataset.label) btn.innerHTML=btn.dataset.label; }
}
function download(filename,content,mime="text/csv;charset=utf-8"){
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=Object.assign(document.createElement("a"),{href:url,download:filename});
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function printHTML(html,className=""){
  let area=$("#printArea"); if(!area){ area=document.createElement("div"); area.id="printArea"; document.body.append(area); }
  area.className=className; area.innerHTML=html;
  const done=()=>{ document.body.classList.remove("printing"); area.innerHTML=""; removeEventListener("afterprint",done); };
  addEventListener("afterprint",done);
  document.body.classList.add("printing");
  const imgs=[...area.querySelectorAll("img")].filter(i=>!i.complete);
  Promise.all(imgs.map(i=>new Promise(r=>{ i.onload=i.onerror=r; }))).then(()=>setTimeout(()=>window.print(),80));
}
function openModal(html,{onClose}={}){
  const wrap=document.createElement("div"); wrap.className="modal-wrap";
  wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(wrap);
  const close=()=>{ wrap.remove(); document.removeEventListener("keydown",esc); onClose?.(); };
  const esc=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esc);
  wrap.addEventListener("mousedown",e=>{ if(e.target===wrap) close(); });
  wrap.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",close));
  return { el:wrap.firstElementChild, close };
}
function banner(el,msg,type="err"){
  if(!el) return;
  if(!msg){ el.hidden=true; el.textContent=""; return; }
  el.hidden=false; el.className="banner "+type; el.innerHTML=`${icon(type==="ok"?"check":"alert")}<span>${escapeHtml(msg)}</span>`;
}
function watchConnection(){
  let bar=$("#netbar");
  if(!bar){ bar=document.createElement("div"); bar.id="netbar"; bar.className="netbar"; bar.textContent="You are offline. Changes will not save until the connection returns."; bar.hidden=true; document.body.prepend(bar); }
  const sync=()=>{ bar.hidden=navigator.onLine!==false; };
  addEventListener("online",sync); addEventListener("offline",sync); sync();
}
watchConnection();

async function renderClass(q){
  stopLive();
  const classId=(q.id||"").trim().toUpperCase();
  root.innerHTML=`<div class="center-page"><div class="sheet">
    <img class="crest" src="${LOGO}" width="84" height="84" alt="B/Hindu College Welimada crest">

  </div></div>`;
  $("#staffLink").addEventListener("click",e=>{ e.preventDefault(); openClassLogin(()=>go()); });
  const panel=$("#panel");
  let cls=null, today=todayISO(), existing=null;

  function loading(text){ panel.innerHTML=`<div class="loading"><span class="spin"></span>${escapeHtml(text)}</div>`; }
  function showProblem(title,msg,home=false,retry=false){
    panel.innerHTML=`<div class="empty"><strong>${escapeHtml(title)}</strong>${escapeHtml(msg)}
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

        ${home?`<a class="btn" href="${hashFor('home')}">Choose your class</a>`:""}</div></div>`;
    $("#retry")?.addEventListener("click",go);
  }
  const header=()=>`<div class="class-badge"><b>${escapeHtml(cls.name||"Grade "+classId)}</b><span>Daily Student Count</span></div><div class="datebar">${fmtDateLong(today)}</div>`;

  async function loadToday(){ today=todayISO(); const s=await getDoc(doc(db,COL.counts,docId(classId,today))); existing=s.exists()?s.data():null; }

  async function go(){
    if(!/^\d{1,2}[A-Z]?$/.test(classId)) return showProblem("This QR code isn't valid","The link doesn't contain a class. Choose your class from the home page.",true);
    loading("Loading today's data...");
    try{
      const snap=await getDoc(doc(db,COL.classes,classId));
      if(!snap.exists()){
        const any=await getDocs(query(collection(db,COL.classes),limit(1)));
        return any.empty ? showProblem("Classes are not set up yet","Ask the school office to open Settings and create the class list.")
                          : showProblem("Class not found",`There is no class "${classId}". Choose your class from the home page.`,true);
      }
      cls={classId,...snap.data()};
      if(cls.active===false) return showProblem("This class is not active","Please contact the school office.");
      await loadToday();
      render();
    }catch(e){ console.error("class load failed",e); showProblem("Couldn't load the class", friendlyError(e), false, true); }
  }

  function render(){
    const u=getSession();
    if(!existing) return renderForm(false);
    const mayEdit=canEditClass(u,classId,cls.name);
    panel.innerHTML=`${header()}<div class="submitted-card">
      <div class="ok-mark">${icon("check",30)}</div>
      <h2 style="text-align:center;font:700 19px var(--serif)">Today's count has already been submitted.</h2>
      <div class="kv"><div><b>${existing.boys}</b><span>Boys</span></div><div><b>${existing.girls}</b><span>Girls</span></div><div><b>${existing.total}</b><span>Total</span></div></div>
      <p class="muted" style="text-align:center;margin:0 0 16px">Submitted at ${fmtTime(existing.submittedAt)}${existing.submittedBy?" by "+escapeHtml(existing.submittedBy):""}${existing.updatedAt?`<br>Last edited at ${fmtTime(existing.updatedAt)}`:""}</p>
      ${mayEdit?`<button class="btn primary block huge" id="editBtn">${icon("edit")} Edit Today's Count</button>`:`<button class="btn block" id="loginBtn">Staff login to edit</button>`}
    </div>`;
    $("#editBtn")?.addEventListener("click",()=>renderForm(true));
    $("#loginBtn")?.addEventListener("click",()=>openClassLogin(render));
  }

  function renderForm(editing){
    const u=getSession();
    const NAME_KEY="whc_teacher_name";
    const savedName=editing?"":(localStorage.getItem(NAME_KEY)||"");
    panel.innerHTML=`${header()}<div id="msg" class="banner err" hidden></div>
      <form id="f" novalidate>
        ${editing?"":`<label class="field">Your name (optional)<input class="input" id="who" maxlength="60" autocomplete="name" value="${escapeHtml(savedName||(u?u.name:""))}" placeholder="Class teacher"></label><div style="height:14px"></div>`}
        <label class="field" for="boys">BOYS</label>
        <input class="input count-input" id="boys" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" placeholder="0" value="${editing?existing.boys:""}">
        <div class="field-err" id="e-boys"></div>
        <div style="height:12px"></div>
        <label class="field" for="girls">GIRLS</label>
        <input class="input count-input" id="girls" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" placeholder="0" value="${editing?existing.girls:""}">
        <div class="field-err" id="e-girls"></div>
        <div class="total-box"><span>TOTAL STUDENTS</span><b id="total">—</b></div>
        <button class="btn primary block huge" id="go2" type="submit">${editing?"SAVE CHANGES":"SUBMIT TODAY'S COUNT"}</button>
        ${editing?'<button class="btn block" id="cancel" type="button" style="margin-top:10px">Cancel</button>':""}
      </form>`;
    const boys=$("#boys"),girls=$("#girls"),total=$("#total");
    const upd=()=>{ const t=liveTotal(boys.value,girls.value); total.textContent=t===null?"—":t;
      boys.classList.remove("invalid"); girls.classList.remove("invalid");
      $("#e-boys").textContent=""; $("#e-girls").textContent=""; banner($("#msg"),""); };
    [boys,girls].forEach(i=>i.addEventListener("input",upd));
    if(editing) upd();
    $("#cancel")?.addEventListener("click",render);
    $("#f").addEventListener("submit",e=>{ e.preventDefault(); save(editing); });
    boys.focus({preventScroll:true});
  }

  async function save(editing){
    const btn=$("#go2"), msg=$("#msg");
    const v=validateCounts($("#boys").value,$("#girls").value);
    if(!v.ok){
      for(const k of ["boys","girls"]){ $("#e-"+k).textContent=v.errors[k]||""; $("#"+k).classList.toggle("invalid",!!v.errors[k]); }
      return $(v.errors.boys?"#boys":"#girls").focus();
    }
    if(navigator.onLine===false) return banner(msg,"You appear to be offline. Check your connection and try again.");
    if(todayISO()!==today){ banner(msg,"The date has changed. Reloading for today…"); return setTimeout(go,1200); }
    const u=getSession();
    const typed=($("#who")?.value||"").trim().slice(0,60);
    const by=editing?(u?.name||"Staff"):(typed||u?.name||"Class teacher (QR)");
    const ref=doc(db,COL.counts,docId(classId,today));
    setBusy(btn,true,editing?"Saving…":"Submitting…");
    try{
      if(editing){ await updateDoc(ref,{boys:v.boys,girls:v.girls,total:v.total,updatedAt:serverTimestamp(),updatedBy:by}); }
      else{
        await runTransaction(db, async tx=>{
          if((await tx.get(ref)).exists()) throw Object.assign(new Error("DUPLICATE"),{code:"already-exists"});
          tx.set(ref,{classId,className:cls.name||"Grade "+classId,date:today,boys:v.boys,girls:v.girls,total:v.total,submittedAt:serverTimestamp(),submittedBy:by});
        });
        if(typed) localStorage.setItem("whc_teacher_name",typed);
      }
      await loadToday(); render();
      const ok=document.createElement("div"); ok.className="banner ok"; ok.style.marginBottom="14px";
      ok.innerHTML=`${icon("check")}<span>✓ ${editing?"Today's count updated successfully":"Today's count submitted successfully"}</span>`;
      panel.prepend(ok);
    }catch(e){
      console.error("save failed",e);
      if(e.code==="already-exists"){ await loadToday(); render(); return; }
      setBusy(btn,false); banner(msg, friendlyError(e,"We couldn't save the count. Please try again."));
    }
  }

  go();
}
function openClassLogin(onSuccess){
  const m=openModal(`<h2>Staff login</h2><p class="muted" style="margin:0 0 12px">Sign in to edit today's count.</p>
    <div id="lmsg" class="banner err" hidden></div>
    <label class="field" style="display:block;margin-top:10px">Username<input class="input" id="lu" autocomplete="username" autocapitalize="none"></label>
    <label class="field" style="display:block;margin-top:10px">Password<input class="input" id="lp" type="password" autocomplete="current-password"></label>
    <div class="actions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="lgo" type="button">Sign in</button></div>`);
  const go=async()=>{
    const b=m.el.querySelector("#lgo"); setBusy(b,true,"Signing in…");
    try{ await login(m.el.querySelector("#lu").value,m.el.querySelector("#lp").value); m.close(); onSuccess(); }

  m.el.querySelector("#lp").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  m.el.querySelector("#lu").focus();
}

/* ============================ render: ANALYTICS ============================ */
const PERIODS=[["today","Today"],["yesterday","Yesterday"],["thisWeek","This Week"],["lastWeek","Last Week"],["thisMonth","This Month"],["lastMonth","Last Month"],["thisYear","This Year"],["custom","Custom"]];
function startOfWeekISO(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); const day=dt.getUTCDay(); dt.setUTCDate(dt.getUTCDate()+(day===0?-6:1-day)); return dt.toISOString().slice(0,10); }
function startOfMonthISO(iso){ return iso.slice(0,7)+"-01"; }
function endOfMonthISO(iso){ const [y,m]=iso.split("-").map(Number); return `${y}-${String(m).padStart(2,"0")}-${String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,"0")}`; }
function periodRange(key,customFrom,customTo){
  const t=todayISO();
  if(key==="today") return {from:t,to:t};
  if(key==="yesterday"){ const y=addDays(t,-1); return {from:y,to:y}; }
  if(key==="thisWeek") return {from:startOfWeekISO(t),to:t};
  if(key==="lastWeek"){ const s=addDays(startOfWeekISO(t),-7); return {from:s,to:addDays(s,6)}; }
  if(key==="thisMonth") return {from:startOfMonthISO(t),to:t};
  if(key==="lastMonth"){ const prevEnd=addDays(startOfMonthISO(t),-1); return {from:startOfMonthISO(prevEnd),to:endOfMonthISO(prevEnd)}; }
  if(key==="thisYear") return {from:t.slice(0,4)+"-01-01",to:t};
  return {from:customFrom||addDays(t,-29),to:customTo||t};
}
function priorPeriod(from,to){
  const days=Math.round((new Date(to+"T00:00:00Z")-new Date(from+"T00:00:00Z"))/86400000)+1;
  const prevTo=addDays(from,-1); return {from:addDays(prevTo,-(days-1)),to:prevTo};
}
function pctChange(cur,prev){ if(prev==null) return null; if(prev===0) return cur===0?0:null; return ((cur-prev)/prev)*100; }
function groupByDate(rows){ const m=new Map(); for(const r of rows){ if(!m.has(r.date)) m.set(r.date,[]); m.get(r.date).push(r); } return m; }
function computePeriodStats(rows,totalClasses){
  const byDate=groupByDate(rows); const dates=[...byDate.keys()].sort();
  if(!dates.length) return {hasData:false};
  let sB=0,sG=0,sT=0,sS=0;
  const dayList=dates.map(d=>{
    const dr=byDate.get(d); const boys=dr.reduce((s,r)=>s+r.boys,0),girls=dr.reduce((s,r)=>s+r.girls,0),total=boys+girls,submitted=dr.length;
    sB+=boys;sG+=girls;sT+=total;sS+=submitted;
    return {date:d,boys,girls,total,submitted,missing:Math.max(0,totalClasses-submitted)};
  });
  const n=dayList.length;
  const best=dayList.reduce((a,b)=>b.total>a.total?b:a,dayList[0]), worst=dayList.reduce((a,b)=>b.total<a.total?b:a,dayList[0]);
  return {hasData:true,days:n,avgTotal:sT/n,avgBoys:sB/n,avgGirls:sG/n,avgSubmitted:sS/n,submissionRate:totalClasses?(sS/(n*totalClasses))*100:null,dayList,best,worst};
}
function acard(iconTxt,label,val,fmt,prevVal){
  const diff=(prevVal!=null&&val!=null)?val-prevVal:null;
  const pct=(prevVal!=null&&val!=null)?pctChange(val,prevVal):null;
  const trend=diff==null?"":diff>0.0001?"up":diff<-0.0001?"down":"flat";
  return `<div class="acard"><div class="acard-top"><span>${iconTxt}</span><span>${escapeHtml(label)}</span></div>
    <div class="acard-val">${val==null?"—":fmt(val)}</div>
    ${(prevVal!=null&&val!=null)?`<div class="acard-cmp ${trend}">${diff>=0?"+":""}${fmt(diff)} vs previous (${pct==null?"—":(pct>=0?"+":"")+pct.toFixed(1)+"%"})</div>`:'<div class="acard-cmp flat">No prior-period data</div>'}
  </div>`;
}

        $("#csv").onclick=()=>download(`WHC-${classId}-analytics-${from}_to_${to}.csv`,toCSV([[SCHOOL_NAME],[className+" Analytics"],["Period",`${fmtDateLong(from)} - ${fmtDateLong(to)}`],[],["Date","Boys","Girls","Total"],...rows.map(r=>[fmtDateShort(r.date),r.boys,r.girls,r.total])]));
        $("#pr").onclick=()=>printHTML(`<div class="report-sheet"><div class="report-head"><img src="${LOGO}" width="64" height="64" alt=""><div><h1>${SCHOOL_NAME}</h1><h2>${escapeHtml(className)} Analytics</h2><p>${fmtDateLong(from)} – ${fmtDateLong(to)}</p></div></div>
          <table class="report-totals"><tbody><tr><th>Class Average</th><td>${fmt1(avgTotal)}</td></tr><tr><th>Boys Average</th><td>${fmt1(avgBoys)}</td></tr><tr><th>Girls Average</th><td>${fmt1(avgGirls)}</td></tr><tr><th>Submission Rate</th><td>${subRate==null?"—":fmtPct(subRate)}</td></tr></tbody></table>
          <table class="report-table" style="margin-top:14px"><thead><tr><th>Date</th><th class="num">Boys</th><th class="num">Girls</th><th class="num">Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtDateShort(r.date)}</td><td class="num">${r.boys}</td><td class="num">${r.girls}</td><td class="num">${r.total}</td></tr>`).join("")}</tbody></table>
          <p class="report-foot">Generated ${new Date().toLocaleString("en-GB",{timeZone:TIMEZONE})} · WHC Student Daily Count Management System</p></div>`);
      }catch(e){ console.error(e); $("#cw-body").innerHTML=`<div class="empty"><strong>Couldn't load class analytics</strong>${escapeHtml(friendlyError(e))}</div>`; }
    }
    load();
  }

  /* ---------------- Compare Classes ---------------- */
  async function renderCompare(){
    const pane=$("#pane");
    const cls=await getClasses();
    const state={period:"thisMonth",from:null,to:null,selected:new Set(cls.slice(0,Math.min(4,cls.length)).map(c=>c.classId))};
    const r0=periodRange(state.period); state.from=r0.from; state.to=r0.to;
    pane.innerHTML=`<p class="mini-note">Pick 2–10 classes to compare over the same period.</p>
      <div class="class-compare-picker">${cls.map(c=>`<button data-c="${c.classId}" class="${state.selected.has(c.classId)?"on":""}" type="button">${escapeHtml(c.name||"Grade "+c.classId)}</button>`).join("")}</div>
      ${periodPickerHTML(state)}<div id="cmp-body"><div class="loading"><span class="spin"></span>Loading...</div></div>`;
    $$(".class-compare-picker button",pane).forEach(b=>b.onclick=()=>{
      const id=b.dataset.c;
      if(state.selected.has(id)) state.selected.delete(id);
      else{ if(state.selected.size>=10) return toast("You can compare up to 10 classes.","err"); state.selected.add(id); }
      b.classList.toggle("on"); load();
    });
    wirePeriodPicker(pane,state,load);
    async function load(){
      refreshPicker(pane,state,load);
      const body=$("#cmp-body");
      const ids=[...state.selected];
      if(ids.length<2){ body.innerHTML=`<div class="empty"><strong>Select at least 2 classes</strong>Choose classes above to compare.</div>`; return; }
      body.innerHTML=`<div class="loading"><span class="spin"></span>Loading...</div>`;
      try{
        const {from,to}=state;
        const results=await Promise.all(ids.map(id=>getDocs(query(collection(db,COL.counts),where("classId","==",id),where("date",">=",from),where("date","<=",to)))));
        const periodDays=Math.round((new Date(to+"T00:00:00Z")-new Date(from+"T00:00:00Z"))/86400000)+1;
        const fmt1=v=>String(Math.round(v*10)/10);
        const stats=ids.map((id,i)=>{
          const rows=results[i].docs.map(d=>d.data());
          const className=cls.find(c=>c.classId===id)?.name||"Grade "+id;
          if(!rows.length) return {id,className,hasData:false};
          const avgTotal=rows.reduce((s,r)=>s+r.total,0)/rows.length, avgBoys=rows.reduce((s,r)=>s+r.boys,0)/rows.length, avgGirls=rows.reduce((s,r)=>s+r.girls,0)/rows.length;
          return {id,className,hasData:true,students:rows.length,avgTotal,avgBoys,avgGirls,subRate:periodDays?rows.length/periodDays*100:null};
        });
        body.innerHTML=`
          <div class="card" style="margin-bottom:18px"><div class="card-head"><h2>Comparison — ${fmtDateLong(from)} – ${fmtDateLong(to)}</h2>
            <div><button class="btn sm" id="csv">${icon("download")} CSV</button> <button class="btn sm navy" id="pr">${icon("print")} Print</button></div></div>
            <div class="table-wrap"><table class="tbl"><thead><tr><th>Class</th><th class="num">Days Submitted</th><th class="num">Avg Total</th><th class="num">Avg Boys</th><th class="num">Avg Girls</th><th class="num">Submission Rate</th></tr></thead>
            <tbody>${stats.map(s=>s.hasData?`<tr><td>${escapeHtml(s.className)}</td><td class="num">${s.students}</td><td class="num">${fmt1(s.avgTotal)}</td><td class="num">${fmt1(s.avgBoys)}</td><td class="num">${fmt1(s.avgGirls)}</td><td class="num">${s.subRate==null?"—":s.subRate.toFixed(1)+"%"}</td></tr>`:`<tr><td>${escapeHtml(s.className)}</td><td colspan="5" class="muted">No data in this period</td></tr>`).join("")}</tbody></table></div></div>
          <div class="card"><h2 style="margin-bottom:12px">Average Total Students by Class</h2><div class="chart-box"><canvas id="cmpBar"></canvas></div></div>`;
        await ensureCharts();
        const withData=stats.filter(s=>s.hasData);
        new Chart($("#cmpBar"),{type:"bar",data:{labels:withData.map(s=>s.className),datasets:[{label:"Average Total",data:withData.map(s=>Math.round(s.avgTotal*10)/10),backgroundColor:"#0b2447",borderRadius:5,maxBarThickness:36}]},options:{plugins:{legend:{display:false}},maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}});
        $("#csv").onclick=()=>download(`WHC-class-comparison-${from}_to_${to}.csv`,toCSV([[SCHOOL_NAME],["Class Comparison"],["Period",`${fmtDateLong(from)} - ${fmtDateLong(to)}`],[],["Class","Days Submitted","Avg Total","Avg Boys","Avg Girls","Submission Rate"],...stats.map(s=>[s.className,s.hasData?s.students:0,s.hasData?fmt1(s.avgTotal):"",s.hasData?fmt1(s.avgBoys):"",s.hasData?fmt1(s.avgGirls):"",(s.hasData&&s.subRate!=null)?s.subRate.toFixed(1)+"%":""])]));
        $("#pr").onclick=()=>printHTML(`<div class="report-sheet"><div class="report-head"><img src="${LOGO}" width="64" height="64" alt=""><div><h1>${SCHOOL_NAME}</h1><h2>Class Comparison</h2><p>${fmtDateLong(from)} – ${fmtDateLong(to)}</p></div></div>
          <table class="report-table"><thead><tr><th>Class</th><th class="num">Days</th><th class="num">Avg Total</th><th class="num">Avg Boys</th><th class="num">Avg Girls</th><th class="num">Sub. Rate</th></tr></thead><tbody>${stats.map(s=>s.hasData?`<tr><td>${escapeHtml(s.className)}</td><td class="num">${s.students}</td><td class="num">${fmt1(s.avgTotal)}</td><td class="num">${fmt1(s.avgBoys)}</td><td class="num">${fmt1(s.avgGirls)}</td><td class="num">${s.subRate==null?"—":s.subRate.toFixed(1)+"%"}</td></tr>`:`<tr><td>${escapeHtml(s.className)}</td><td colspan="5">No data</td></tr>`).join("")}</tbody></table>
          <p class="report-foot">Generated ${new Date().toLocaleString("en-GB",{timeZone:TIMEZONE})} · WHC Student Daily Count Management System</p></div>`);
      }catch(e){ console.error(e); $("#cmp-body").innerHTML=`<div class="empty"><strong>Couldn't load comparison</strong>${escapeHtml(friendlyError(e))}</div>`; }
    }
    load();
  }
}

/* =============================== render: QR ============================== */
async function renderQR(){
  const u=requireAdmin(); if(!u) return;
  stopLive();
  const content=mountShell("qr","QR Codes","Class QR codes for daily submissions, and the admin login QR");
  content.innerHTML=`<div class="loading"><span class="spin"></span>Loading classes...</div>`;
  let siteUrl="";
  try{ const s=await getDoc(doc(db,COL.settings,"site")); siteUrl=s.exists()?(s.data().siteUrl||""):""; }catch{}
  const base=siteUrl || (location.origin+location.pathname);
  await ensureQR();
  let cls;
  try{
    const snap=await getDocs(collection(db,COL.classes));
    cls=(snap.empty?DEFAULT_CLASSES:snap.docs.map(d=>({classId:d.id,...d.data()}))).filter(c=>c.active!==false).sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));
  }catch(e){ console.error(e); content.innerHTML=`<div class="empty"><strong>Couldn't load classes</strong>${escapeHtml(friendlyError(e))}</div>`; return; }

  const usingDefault=!siteUrl;
  content.innerHTML=`${usingDefault?`<div class="banner info" style="margin-bottom:16px">${icon("alert")}<span>Using this page's own address for the QR links. Set the live website address in <a href="${hashFor('settings')}">Settings</a> before printing QR codes for classrooms.</span></div>`:""}
    <div class="toolbar"><h2 style="font:700 20px var(--serif)">Class QR Codes</h2><div class="grow"></div><button class="btn navy" id="printAll">${icon("print")} PRINT ALL QR CODES</button></div>
    <div class="qr-grid" id="grid"></div>
    <div class="card" style="margin-top:24px"><h2 style="margin-bottom:6px">Administration login QR</h2>
      <p class="muted" style="margin:0 0 14px">Scanning this opens the secure admin login page. It never contains a password.</p>
      <div class="qr-tile" style="margin:0 auto;max-width:230px"><div class="qr" id="adminQr"></div><p><code id="adminLink"></code></p>
        <div class="btns"><button class="btn sm" data-dl="admin">${icon("download")} Download</button><button class="btn sm" data-copy="admin">${icon("copy")} Copy Link</button></div></div>
    </div>`;

  const grid=$("#grid");
  cls.forEach(c=>{
    const link=base+`#/class/${encodeURIComponent(c.classId)}`;
    const tile=document.createElement("div"); tile.className="qr-tile";
    tile.innerHTML=`<h3>${escapeHtml(c.name||"Grade "+c.classId)}</h3><div class="qr" id="qr-${c.classId}"></div>
      <p>Scan to submit today's count</p><code>${escapeHtml(c.classId)}</code>
      <div class="btns"><button class="btn sm" data-dl="${c.classId}">${icon("download")} Download</button>
        <button class="btn sm" data-print="${c.classId}">${icon("print")} Print</button>
        <button class="btn sm" data-copy="${c.classId}">${icon("copy")} Copy Link</button></div>`;
    grid.append(tile);
    new QRCode(tile.querySelector(".qr"),{text:link,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
  });
  const adminLink=base+"#/login";
  $("#adminLink").textContent=adminLink;
  new QRCode($("#adminQr"),{text:adminLink,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});

  function downloadCanvas(canvas,name){ if(!canvas) return toast("QR code isn't ready yet.","err"); const a=Object.assign(document.createElement("a"),{href:canvas.toDataURL("image/png"),download:name}); document.body.append(a); a.click(); a.remove(); }
  async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast("Link copied"); }catch{ toast("Couldn't copy the link","err"); } }
  function cardHTML(c,imgSrc,url){ return `<div class="print-card"><img class="logo" src="${LOGO}" alt=""><div class="sn">${SCHOOL_NAME}</div><div class="gr">${escapeHtml(c.name||"Grade "+c.classId)}</div>${imgSrc?`<img class="qrimg" src="${imgSrc}" alt="QR code">`:""}<div class="cap">Daily Student Count</div><div class="url">${escapeHtml(url)}</div></div>`; }

  grid.addEventListener("click",e=>{
    const dl=e.target.closest("[data-dl]"), cp=e.target.closest("[data-copy]"), pr=e.target.closest("[data-print]");
    if(dl) downloadCanvas(document.querySelector(`#qr-${CSS.escape(dl.dataset.dl)} canvas`), `WHC-grade-${dl.dataset.dl}-QR.png`);
    if(cp) copyText(base+`#/class/${encodeURIComponent(cp.dataset.copy)}`);
    if(pr){ const c=cls.find(x=>x.classId===pr.dataset.print); const img=document.querySelector(`#qr-${CSS.escape(c.classId)} canvas`)?.toDataURL("image/png"); printHTML(cardHTML(c,img,base+`#/class/${encodeURIComponent(c.classId)}`),"qr-page"); }
  });
  document.body.addEventListener("click", function adminClickHandler(e){
    if(e.target.closest("[data-dl='admin']")) downloadCanvas($("#adminQr canvas"),"WHC-admin-login-QR.png");
    if(e.target.closest("[data-copy='admin']")) copyText(adminLink);
  }, { once:false });
  $("#printAll").onclick=()=>{
    const cards=cls.map(c=>{ const img=document.querySelector(`#qr-${CSS.escape(c.classId)} canvas`)?.toDataURL("image/png"); return cardHTML(c,img,base+`#/class/${encodeURIComponent(c.classId)}`); });
    const pages=[]; for(let i=0;i<cards.length;i+=4) pages.push(`<div class="qr-page">${cards.slice(i,i+4).join("")}</div>`);
    printHTML(pages.join(""));
  };
}

/* =============================== render: USERS ============================ */
async function renderUsers(){
  const u=requireAdmin(); if(!u) return;
  stopLive();
  const content=mountShell("users","Users","Principal, teachers and other staff accounts");
  content.innerHTML=`<div class="banner info" style="margin-bottom:16px">${icon("alert")}<span>Accounts are created and removed in the Teacher Management system. Here you can review staff and assign classes for daily-count submissions.</span></div>
    <div class="toolbar"><div class="search"><span>${icon("search")}</span><input class="input" id="q" placeholder="Search name or username"></div>
      <select class="input" id="roleF" style="width:auto"><option value="all">All roles</option>${Object.entries(ROLE_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <div class="grow"></div><span class="muted" id="count"></span></div>
    <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Assigned Class</th><th>Username</th><th></th></tr></thead>
    <tbody id="tb"><tr><td colspan="5"><div class="loading"><span class="spin"></span>Loading staff...</div></td></tr></tbody></table></div></div>`;
  let staff=[], classes=[], text="", role="all";
  $("#q").addEventListener("input",debounce(e=>{ text=e.target.value.trim().toLowerCase(); draw(); },150));
  $("#roleF").addEventListener("change",e=>{ role=e.target.value; draw(); });

  try{
    const [sSnap,cSnap]=await Promise.all([
      getDocs(query(collection(db,COL.staff),orderBy("name"))).catch(()=>getDocs(collection(db,COL.staff))),
      getDocs(collection(db,COL.classes))
    ]);
    staff=sSnap.docs.map(d=>({id:d.id,...d.data(),role:cleanRole(d.data().role)}));
    classes=(cSnap.empty?DEFAULT_CLASSES:cSnap.docs.map(d=>({classId:d.id,...d.data()}))).filter(c=>c.active!==false).sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));
    draw();
  }catch(e){ console.error(e); $("#tb").innerHTML=`<tr><td colspan="5"><div class="empty"><strong>Couldn't load staff</strong>${escapeHtml(friendlyError(e))}</div></td></tr>`; }

  function draw(){
    let view=staff;
    if(role!=="all") view=view.filter(s=>s.role===role);
    if(text) view=view.filter(s=>(s.name||"").toLowerCase().includes(text)||(s.username||"").toLowerCase().includes(text));
    $("#count").textContent=`${view.length} of ${staff.length} staff`;
    $("#tb").innerHTML=view.length?view.map(s=>`<tr><td><strong>${escapeHtml(s.name||"—")}</strong></td><td><span class="pill role">${escapeHtml(ROLE_LABELS[s.role]||s.role)}</span></td><td>${escapeHtml(s.className||"—")}</td><td class="muted">${escapeHtml(s.username||"—")}</td><td><button class="btn sm" data-assign="${s.id}">Assign class</button></td></tr>`).join("") : `<tr><td colspan="5"><div class="empty"><strong>No matching staff</strong></div></td></tr>`;
  }
  $("#tb").addEventListener("click",e=>{
    const b=e.target.closest("[data-assign]"); if(!b) return;
    const s=staff.find(x=>x.id===b.dataset.assign); if(s) openAssign(s);
  });
  function openAssign(s){
    const m=openModal(`<h2>Assign class</h2><p class="muted" style="margin:0 0 6px">${escapeHtml(s.name)} · ${escapeHtml(ROLE_LABELS[s.role]||s.role)}</p>
      <div id="amsg" class="banner err" hidden></div>
      <label class="field" style="display:block;margin-top:12px">Class<select class="input" id="ac"><option value="">— None —</option>${classes.map(c=>`<option value="${escapeHtml(c.name||"Grade "+c.classId)}" ${s.className===(c.name||"Grade "+c.classId)?"selected":""}>${escapeHtml(c.name||"Grade "+c.classId)}</option>`).join("")}</select></label>
      <div class="actions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="save" type="button">Save</button></div>`);
    m.el.querySelector("#save").onclick=async()=>{
      const btn=m.el.querySelector("#save"); setBusy(btn,true,"Saving…");
      try{ await updateDoc(doc(db,COL.staff,s.id),{className:m.el.querySelector("#ac").value}); s.className=m.el.querySelector("#ac").value; m.close(); draw(); toast("Class assigned"); }
      catch(e){ console.error(e); setBusy(btn,false); banner(m.el.querySelector("#amsg"), friendlyError(e,"Couldn't save. Please try again.")); }
    };
  }
}

/* ============================== render: SETTINGS ========================== */
async function renderSettings(){
  const u=requireAdmin(); if(!u) return;
  stopLive();
  const content=mountShell("settings","Settings","Classes and site configuration");
  content.innerHTML=`<div class="card" style="margin-bottom:20px"><h2 style="margin-bottom:6px">Website address</h2>
      <p class="muted" style="margin:0 0 14px">Used to build the QR code links on the QR Codes page (e.g. https://whc-daily-count.web.app/). Leave blank to use this page's own address.</p>
      <div id="umsg" class="banner err" hidden style="margin-bottom:12px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><input class="input" id="siteUrl" placeholder="https://yourschool.web.app/" style="flex:1;min-width:240px"><button class="btn primary" id="saveUrl">Save</button></div></div>
    <div class="card"><div class="card-head"><h2>Classes</h2><span class="muted" id="cCount"></span></div>
      <div id="setupMsg"></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Class Name</th><th>Status</th><th></th></tr></thead>
      <tbody id="tb"><tr><td colspan="4"><div class="loading"><span class="spin"></span>Loading classes...</div></td></tr></tbody></table></div></div>`;

  let classes=[];
  try{ const s=await getDoc(doc(db,COL.settings,"site")); $("#siteUrl").value=s.exists()?(s.data().siteUrl||""):""; }catch(e){ console.error(e); }
  $("#saveUrl").onclick=async()=>{
    const btn=$("#saveUrl"), val=$("#siteUrl").value.trim();
    if(val && !/^https?:\/\/.+/.test(val)) return banner($("#umsg"),"Enter a full address starting with http:// or https://");
    setBusy(btn,true,"Saving…");
    try{ await setDoc(doc(db,COL.settings,"site"),{siteUrl:val.replace(/\/?$/,"/")}); banner($("#umsg"),""); toast("Website address saved"); }
    catch(e){ console.error(e); banner($("#umsg"),friendlyError(e)); }
    setBusy(btn,false);
  };

  async function load(){
    try{
      const snap=await getDocs(collection(db,COL.classes));
      classes=snap.docs.map(d=>({classId:d.id,...d.data()})).sort((a,b)=>(a.sortOrder??999)-(b.sortOrder??999));
      if(!classes.length){
        $("#setupMsg").innerHTML=`<div class="banner info" style="margin-bottom:14px">${icon("alert")}<span>No classes found yet. Create the 19 standard classes to get started.</span><button class="btn primary sm" id="seed" style="margin-left:auto">Create default classes</button></div>`;
        $("#seed").onclick=seed;
      }else{ $("#setupMsg").innerHTML=""; }
      draw();
    }catch(e){ console.error(e); $("#tb").innerHTML=`<tr><td colspan="4"><div class="empty"><strong>Couldn't load classes</strong>${escapeHtml(friendlyError(e))}</div></td></tr>`; }
  }
  async function seed(){
    const btn=$("#seed"); setBusy(btn,true,"Creating…");
    try{ const batch=writeBatch(db); DEFAULT_CLASSES.forEach(c=>batch.set(doc(db,COL.classes,c.classId),c,{merge:true})); await batch.commit(); toast("Default classes created"); load(); }
    catch(e){ console.error(e); setBusy(btn,false); toast(friendlyError(e),"err"); }
  }
  function draw(){
    $("#cCount").textContent=`${classes.length} classes`;
    $("#tb").innerHTML=classes.length?classes.map(c=>`<tr><td><code>${escapeHtml(c.classId)}</code></td><td>${escapeHtml(c.name||"Grade "+c.classId)}</td><td><span class="pill ${c.active===false?"no":"ok"}">${c.active===false?"Inactive":"Active"}</span></td><td style="display:flex;gap:6px"><button class="btn sm" data-rename="${c.classId}">Rename</button><button class="btn sm" data-toggle="${c.classId}">${c.active===false?"Activate":"Deactivate"}</button></td></tr>`).join("") : `<tr><td colspan="4"><div class="empty"><strong>No classes yet</strong></div></td></tr>`;
  }
  $("#tb").addEventListener("click", async e=>{
    const t=e.target.closest("[data-toggle]"), r=e.target.closest("[data-rename]");
    if(t){ const c=classes.find(x=>x.classId===t.dataset.toggle); try{ await updateDoc(doc(db,COL.classes,c.classId),{active:c.active===false}); c.active=c.active===false; draw(); }catch(e2){ console.error(e2); toast(friendlyError(e2),"err"); } }
    if(r){
      const c=classes.find(x=>x.classId===r.dataset.rename);
      const m=openModal(`<h2>Rename class</h2><p class="muted" style="margin:0 0 10px">Class ID: <code>${escapeHtml(c.classId)}</code> (fixed)</p><label class="field" style="display:block">Display name<input class="input" id="nm" value="${escapeHtml(c.name||"")}"></label><div class="actions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="sv" type="button">Save</button></div>`);
      m.el.querySelector("#sv").onclick=async()=>{
        const btn=m.el.querySelector("#sv"), val=m.el.querySelector("#nm").value.trim(); if(!val) return;
        setBusy(btn,true,"Saving…");
        try{ await updateDoc(doc(db,COL.classes,c.classId),{name:val}); c.name=val; m.close(); draw(); }
        catch(e2){ console.error(e2); setBusy(btn,false); toast(friendlyError(e2),"err"); }
      };
    }
  });
  load();
}

/* ================================ router go ============================= */
function route(){
  const { page, seg1, q } = parseHash();
  window.scrollTo(0,0);
  if(page==="home") return renderHome();
  if(page==="login") return renderLogin(q);
  if(page==="class") return renderClass({ id: seg1 || q.id || "" });
  if(page==="dashboard") return renderDashboard();
  if(page==="reports") return renderReports(seg1);
  if(page==="analytics") return renderAnalytics(seg1);
  if(page==="classes") return renderClasses(seg1);
  if(page==="qr") return renderQR();
  if(page==="users") return renderUsers();
  if(page==="settings") return renderSettings();
  return renderHome();
}
addEventListener("hashchange", route);
if(!location.hash) location.hash = "#/";
route();
</script>

    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:100001;
    box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 0 4px rgba(59,130,246,.12);
    transition:transform .2s ease, box-shadow .2s ease;
    font:700 24px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #rizka-ai-launcher:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 5px rgba(59,130,246,.16);
  }
  #rizka-ai-launcher:focus-visible{
    outline:3px solid rgba(125,211,252,.9);
    outline-offset:3px;
  }
  #rizka-ai-launcher .rizka-ai-icon{
    width:28px;height:28px;display:grid;place-items:center;
    border-radius:10px;background:rgba(255,255,255,.15);
    font-size:18px;
  }

  #rizka-ai-panel{
    position:fixed;
    right:18px;
    bottom:88px;
    width:min(390px,calc(100vw - 28px));
    height:min(620px,calc(100vh - 120px));
    min-height:420px;
    background:#0b1220;
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    overflow:hidden;
    z-index:100000;
    box-shadow:0 22px 70px rgba(0,0,0,.48);
    display:none;
    opacity:0;
    transform:translateY(12px) scale(.98);
    transition:opacity .18s ease, transform .18s ease;
  }
  #rizka-ai-panel.rizka-ai-open{
    display:block;
    opacity:1;
    transform:translateY(0) scale(1);
  }
  #rizka-ai-panel .rizka-ai-bar{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px 0 14px;
    background:linear-gradient(135deg,rgba(15,23,42,.96),rgba(30,64,175,.9));
    color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);
    font:700 13px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #rizka-ai-panel .rizka-ai-title{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  #rizka-ai-panel .rizka-ai-title-dot{
    width:8px;height:8px;border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px rgba(34,197,94,.7);
    flex:none;
  }
  #rizka-ai-panel .rizka-ai-close{
    width:30px;height:30px;
    border:0;
    border-radius:8px;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-size:17px;
  }
  #rizka-ai-panel .rizka-ai-close:hover{background:rgba(255,255,255,.16)}
  #rizka-ai-frame{
    width:100%;
    height:calc(100% - 42px);
    border:0;
    display:block;
    background:#0b1220;
  }

  @media (max-width:600px){
    #rizka-ai-launcher{
      right:14px; bottom:14px; width:54px; height:54px;
    }
    #rizka-ai-panel{
      right:10px; left:10px; bottom:78px;
      width:auto; height:min(76vh,620px);
      min-height:400px; border-radius:16px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    #rizka-ai-launcher,#rizka-ai-panel{transition:none}
  }
</style>

<button id="rizka-ai-launcher" type="button" aria-label="Open AI Assistant" aria-expanded="false" title="Open AI Assistant">
  <span class="rizka-ai-icon">✨</span>
</button>

<section id="rizka-ai-panel" aria-label="AI Assistant">
  <div class="rizka-ai-bar">
    <div class="rizka-ai-title">
      <span class="rizka-ai-title-dot"></span>
      <span>AI Assistant</span>
    </div>
    <button class="rizka-ai-close" type="button" aria-label="Close AI Assistant" title="Close">×</button>
  </div>
  <iframe
    id="rizka-ai-frame"
    title="Embedded AI Assistant"
    src="https://hinducollegewellimada-code.github.io/Portal/Ai%20Assitant/index.html"
    loading="lazy"
    referrerpolicy="same-origin">
  </iframe>
</section>

<script id="rizka-ai-embed-script">
(function(){
  const launcher = document.getElementById("rizka-ai-launcher");
  const panel = document.getElementById("rizka-ai-panel");
  const closeBtn = panel && panel.querySelector(".rizka-ai-close");
  const frame = document.getElementById("rizka-ai-frame");
  if(!launcher || !panel || !closeBtn) return;

  function setOpen(open){
    panel.classList.toggle("rizka-ai-open", open);
    launcher.setAttribute("aria-expanded", String(open));
    launcher.title = open ? "Close AI Assistant" : "Open AI Assistant";
    launcher.querySelector(".rizka-ai-icon").textContent = open ? "×" : "✨";
    if(open && frame){
      try { frame.focus(); } catch(e){}
    }
  }

  launcher.addEventListener("click", function(){
    setOpen(!panel.classList.contains("rizka-ai-open"));
  });

  closeBtn.addEventListener("click", function(){
    setOpen(false);
    launcher.focus();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && panel.classList.contains("rizka-ai-open")){
      setOpen(false);
      launcher.focus();
    }
  });
})();
</script>
